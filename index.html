            "featureList": [
              "Paste spreadsheet cells, CSV or a sentence; rows and units are detected",
              "Three chart suggestions from the shape of the data",
              "Nineteen chart looks including funnel, KPI headline and 2x2 matrix",
              "Post sizes for X, LinkedIn, Story and decks with crop-zone overlays",
              "Post-ready checks: label contrast, text size, crop zones, alt text",

          },
          {
            "@type": "Organization",
            "@id": "https://chartgenie.xyz/#org",
            "name": "ChartGenie",
            "url": "https://chartgenie.xyz/",
            "logo": { "@type": "ImageObject", "url": "https://chartgenie.xyz/favicon.svg" }

          {
            "@type": "FAQPage",
            "mainEntity": [
              { "@type": "Question", "name": "Do I need an account?", "acceptedAnswer": { "@type": "Answer", "text": "No. ChartGenie is free and needs no sign-up. Charts you save are kept in your browser's storage, and you can export a JSON backup." } },

              { "@type": "Question", "name": "How do I export for social posts?", "acceptedAnswer": { "@type": "Answer", "text": "Pick the sizes you need (16:9, 1:1, 9:16, 4:3) and download an export set: PNG and SVG for each size, with caption.txt and alt-text.txt, zipped. Single PNG, SVG and CSV downloads are there too." } },
              { "@type": "Question", "name": "What happens when I share a link?", "acceptedAnswer": { "@type": "Answer", "text": "The chart travels inside the link. When someone opens it, the page renders the chart from the address and a preview card is rendered on request; nothing is stored on a server." } },
              { "@type": "Question", "name": "Is my data sent anywhere?", "acceptedAnswer": { "@type": "Answer", "text": "Editing, exporting and captions run in your browser. Only a share link you create carries chart data, and only so the preview card can be drawn. Analytics events never include titles, labels, values or captions." } }
            ]
          }
        ]
      }
